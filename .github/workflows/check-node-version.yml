name: Check Node.js Version Files

on:
  pull_request:
    paths:
      - ".nvmrc"
      - "package.json"
      - ".github/workflows/check-node-version.yml"

jobs:
  check-node-version-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package.json is updated with .nvmrc
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx '\.nvmrc'; then
            if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'package.json'; then
              echo "Error: .nvmrc was changed, but package.json was not updated."
              exit 1
            fi
          fi